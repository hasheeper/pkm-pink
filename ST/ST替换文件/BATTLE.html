    </button>

  <script id="pkm-json" type="application/json">$1</script>

  <iframe
    id="app-frame"
    title="PKM"
    src="https://hasheeper.github.io/pkm-pink/apps/battle-sim/index.html"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
    allow="fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    (function () {
      const root = document.documentElement;
      const btnEnter = document.getElementById('btn-enter');
      const btnExit = document.getElementById('btn-exit');
      const frame = document.getElementById('app-frame');
      const hostFrame = window.frameElement;

      // 从注入 JSON 读取竖屏模式设置
      function isPortraitMode() {
        try {
          const dataNode = document.getElementById('pkm-json');
          if (!dataNode) return false;
          const raw = (dataNode.textContent || dataNode.innerText || '').trim();
          if (!raw) return false;
          const json = JSON.parse(raw);
          return !!(json.settings?.enableBattlePortraitMode
            || json.settings?.portraitMode
            || json.settings?.enablePortraitMode);
        } catch (e) {
          return false;
        }
      }

      function resizeHostFrame() {
        if (!hostFrame) return;
        const portrait = isPortraitMode();

        // 横屏基准 1100x720，竖屏基准 720x1100
        const maxW = portrait ? 720 : 1100;
        const ratio = portrait ? (1100 / 720) : (720 / 1100);

        hostFrame.style.width = '100%';
        hostFrame.style.maxWidth = maxW + 'px';

        let realWidth = hostFrame.getBoundingClientRect().width || hostFrame.offsetWidth;
        if (!realWidth || realWidth === 0) {
          realWidth = hostFrame.parentElement ? hostFrame.parentElement.clientWidth : (window.innerWidth || maxW);
          realWidth = Math.min(realWidth, maxW);
        }

        hostFrame.style.height = Math.round(realWidth * ratio) + 'px';
        hostFrame.style.border = 'none';
        hostFrame.style.boxShadow = '0 0 0 1px rgba(128, 128, 128, 0.2), 0 6px 20px rgba(0, 0, 0, 0.15)';
        hostFrame.style.borderRadius = '16px';
        hostFrame.style.margin = '10px auto';
        hostFrame.style.display = 'block';
      }

      resizeHostFrame();
      window.addEventListener('resize', resizeHostFrame);

      try {
        const base = frame.getAttribute('src') || '';
        if (base && !/\bv=\d+\b/.test(base)) {
          const sep = base.includes('?') ? '&' : '?';
          frame.src = base + sep + 'v=' + Date.now();
        }
      } catch (e) {}

      function isFullscreen() {
        return !!document.fullscreenElement;
      }

      function isPseudo() {
        return root.classList.contains('pseudo-fullscreen');
      }

      function syncButtons() {
        const active = isFullscreen() || isPseudo();
        btnEnter.hidden = active;
        btnExit.hidden = !active;
      }

      async function enterFullscreen() {
        try {
          if (root.requestFullscreen) {
            await root.requestFullscreen();
            return;
          }
        } catch (e) {}
        root.classList.add('pseudo-fullscreen');
      }

      async function exitFullscreen() {
        try {
          if (isFullscreen() && document.exitFullscreen) {
            await document.exitFullscreen();
          }
        } catch (e) {}
        root.classList.remove('pseudo-fullscreen');
      }

      function parseInjectedData() {
        try {
          const dataNode = document.getElementById('pkm-json');
          if (!dataNode) return null;
          const raw = (dataNode.textContent || dataNode.innerText || '').trim();
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) {
          console.warn('[PKM] 解析注入战斗数据失败:', e);
          return null;
        }
      }

      function postBattleData() {
        const injectedBattleData = parseInjectedData();
        if (!frame || !frame.contentWindow) return;
        if (!injectedBattleData) return;
        frame.contentWindow.postMessage(
          {
            type: 'pkm-battle-data',
            payload: injectedBattleData,
          },
          '*'
        );
      }

      frame.addEventListener('load', postBattleData);

      window.addEventListener('message', (event) => {
        const injectedBattleData = parseInjectedData();
        const payload = event?.data;
        if (!payload || payload.type !== 'pkm-battle-data-request') return;
        if (!injectedBattleData || !frame || !frame.contentWindow) return;
        frame.contentWindow.postMessage(
          {
            type: 'pkm-battle-data',
            payload: injectedBattleData,
          },
          '*'
        );
      });

      btnEnter.addEventListener('click', () => {
        enterFullscreen().finally(syncButtons);
      });
      btnExit.addEventListener('click', () => {
        exitFullscreen().finally(syncButtons);
      });

      document.addEventListener('fullscreenchange', syncButtons);
      syncButtons();
    })();
  </script>
</body>
</html>
