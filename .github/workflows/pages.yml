name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp README.md _site/ 2>/dev/null || true
          cp .nojekyll _site/ 2>/dev/null || touch _site/.nojekyll

          for dir in apps containers registry packages docs archive; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done

          find _site -name '.DS_Store' -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
